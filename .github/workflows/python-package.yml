name: Python Package

on:
  pull_request:
    paths:
      - ".github/workflows/python-package.yml"
      - "python/**"
      - "src/rust/freestiler-core/**"
  push:
    branches:
      - main
    tags:
      - "python-v*"
    paths:
      - ".github/workflows/python-package.yml"
      - "python/**"
      - "src/rust/freestiler-core/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-native-input:
    name: Native input regressions
    runs-on: ubuntu-latest
    env:
      DUCKDB_EXPLICIT_PLATFORM: linux_amd64
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test temporal properties and CRS-tagged geometry
        run: cargo test --locked --manifest-path src/rust/freestiler-core/Cargo.toml --features geoparquet,duckdb --test native_input

  build-wheels:
    name: Build Wheel (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.9"
            manylinux: "2_28"
            duckdb_explicit_platform: "linux_amd64"
            interpreter: "/opt/python/cp39-cp39/bin/python"
          - os: ubuntu-latest
            python-version: "3.10"
            manylinux: "2_28"
            duckdb_explicit_platform: "linux_amd64"
            interpreter: "/opt/python/cp310-cp310/bin/python"
          - os: ubuntu-latest
            python-version: "3.11"
            manylinux: "2_28"
            duckdb_explicit_platform: "linux_amd64"
            interpreter: "/opt/python/cp311-cp311/bin/python"
          - os: ubuntu-latest
            python-version: "3.12"
            manylinux: "2_28"
            duckdb_explicit_platform: "linux_amd64"
            interpreter: "/opt/python/cp312-cp312/bin/python"
          - os: ubuntu-latest
            python-version: "3.13"
            manylinux: "2_28"
            duckdb_explicit_platform: "linux_amd64"
            interpreter: "/opt/python/cp313-cp313/bin/python"
          - os: ubuntu-latest
            python-version: "3.14"
            manylinux: "2_28"
            duckdb_explicit_platform: "linux_amd64"
            interpreter: "/opt/python/cp314-cp314/bin/python"
          # Pinned to windows-2022 (VS 2022): both windows-latest and
          # windows-2025 now resolve to the VS 2026 image, whose MSVC removed
          # stdext::checked_array_iterator and breaks the bundled DuckDB build
          # (vendored fmt). Revisit once duckdb-rs supports VS 2026.
          - os: windows-2022
            python-version: "3.9"
            manylinux: "auto"
            duckdb_explicit_platform: ""
            interpreter: "python"
          - os: windows-2022
            python-version: "3.10"
            manylinux: "auto"
            duckdb_explicit_platform: ""
            interpreter: "python"
          - os: windows-2022
            python-version: "3.11"
            manylinux: "auto"
            duckdb_explicit_platform: ""
            interpreter: "python"
          - os: windows-2022
            python-version: "3.12"
            manylinux: "auto"
            duckdb_explicit_platform: ""
            interpreter: "python"
          - os: windows-2022
            python-version: "3.13"
            manylinux: "auto"
            duckdb_explicit_platform: ""
            interpreter: "python"
          - os: windows-2022
            python-version: "3.14"
            manylinux: "auto"
            duckdb_explicit_platform: ""
            interpreter: "python"
          - os: macos-14
            python-version: "3.9"
            manylinux: "auto"
            duckdb_explicit_platform: ""
            interpreter: "python"
          - os: macos-14
            python-version: "3.10"
            manylinux: "auto"
            duckdb_explicit_platform: ""
            interpreter: "python"
          - os: macos-14
            python-version: "3.11"
            manylinux: "auto"
            duckdb_explicit_platform: ""
            interpreter: "python"
          - os: macos-14
            python-version: "3.12"
            manylinux: "auto"
            duckdb_explicit_platform: ""
            interpreter: "python"
          - os: macos-14
            python-version: "3.13"
            manylinux: "auto"
            duckdb_explicit_platform: ""
            interpreter: "python"
          - os: macos-14
            python-version: "3.14"
            manylinux: "auto"
            duckdb_explicit_platform: ""
            interpreter: "python"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: PyO3/maturin-action@v1
        env:
          DUCKDB_EXPLICIT_PLATFORM: ${{ matrix.duckdb_explicit_platform }}
        with:
          command: build
          args: --manifest-path python/Cargo.toml --release --out dist -i ${{ matrix.interpreter }}
          manylinux: ${{ matrix.manylinux }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --manifest-path python/Cargo.toml --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*

  publish-pypi:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist]
    if: startsWith(github.ref, 'refs/tags/python-v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/freestiler
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
